services:
  service:
    build: .
    ports:
      - '127.0.0.1:4318:4318'
    volumes:
      - jencut-data:/data
    init: true
    restart: unless-stopped
    cpus: 4
    mem_limit: 2g
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4318/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
volumes:
  jencut-data:
