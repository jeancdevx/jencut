name: Checks
on:
  push:
  pull_request:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Check conventional commits
        env:
          JENCUT_COMMIT_BASE:
            ${{ github.event.pull_request.base.sha || github.event.before }}
          JENCUT_COMMIT_HEAD:
            ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jencut_commit_base="$JENCUT_COMMIT_BASE"
          if [ -z "$jencut_commit_base" ] || [ "$jencut_commit_base" = "0000000000000000000000000000000000000000" ]; then
            jencut_commit_base="$(git merge-base origin/develop HEAD)"
          fi
          pnpm exec commitlint --from "$jencut_commit_base" --to "$JENCUT_COMMIT_HEAD"
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          JENCUT_PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$JENCUT_PR_TITLE" | pnpm exec commitlint
      - run: pnpm fixtures:verify
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dev
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            progress/evidence
            playwright-report
